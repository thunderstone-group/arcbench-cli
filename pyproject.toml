[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcbench-cli"
version = "0.3.0"
description = "A standard-library CLI for ARC-Bench competition discovery, submission, and run inspection."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
arcbench = "arcbench_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arcbench_cli = ["py.typed"]
