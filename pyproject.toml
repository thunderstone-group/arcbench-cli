[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcbench-cli"
version = "0.1.0"
description = "A small CLI for ARC-Bench competition discovery, submission, polling, and local replay."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=41",
]

[project.scripts]
arcbench = "arcbench_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arcbench_cli = ["py.typed"]
